spring.application.name=Parking-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parkgrid_parking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
jwt.secret=${JWT_SECRET:parkgrid-local-development-secret-key-123456789}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
